<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fcknggn — история</title>
<link rel="icon" href="img/badge.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a long-read story in one column on knit fur: a cream "page" with big chapter openers, two feature chapters set on feathers and hills, photo strips, one app mock-up of the warn card */
:root{
  --ink:#2c3d1a;
  --moss:#4e6232;
  --lime:#c3d08a;
  --pink:#e9a9b7;
  --pink-deep:#cf7c8c;
  --cream:#fffaf5;
  --font:"Onest","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:18px/1.6 var(--font);color:var(--ink);background:#c2ce86 url(img/fur-orig.webp) center/640px repeat;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wrap{max-width:780px;margin:0 auto;padding:22px 14px 48px;display:grid;gap:16px}
.top{display:flex;justify-content:flex-end}
.lang{border:0;border-radius:999px;padding:7px 14px;font:700 13px var(--font);letter-spacing:.06em;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 10px rgba(30,45,15,.2)}
.lang:focus-visible,a:focus-visible{outline:3px solid var(--pink-deep);outline-offset:2px}
section{border-radius:30px;overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(30,45,15,.22);break-inside:avoid}
.page{background:var(--cream);padding:34px 34px}
.page p{max-width:60ch;margin:0 0 14px}
.page p:last-child{margin-bottom:0}
h1,h2,h3{margin:0}
h1{font-weight:800;font-size:48px;line-height:1;letter-spacing:-.02em}
h2{font-weight:800;font-size:30px;line-height:1.12;text-wrap:balance}
.sub{font-size:22px;line-height:1.3;font-weight:700;color:var(--pink-deep);margin-top:12px;text-wrap:balance;max-width:26ch}
.kicker{font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--pink-deep);margin-bottom:8px}
/* hero */
.hero{display:grid;grid-template-columns:1fr 200px;gap:24px;align-items:center}
.hero img{width:200px;height:200px;border-radius:36px;box-shadow:0 8px 22px rgba(30,45,15,.25);transform:rotate(3deg)}
@media (max-width:600px){.hero{grid-template-columns:1fr}.hero img{width:150px;height:150px}h1{font-size:40px}h2{font-size:26px}.page{padding:26px 22px}}
/* photo strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:0;box-shadow:0 10px 30px rgba(30,45,15,.22)}
.strip img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.cap{background:var(--ink);color:#f8cdd7;font-weight:700;font-size:15px;padding:10px 18px}
/* chapter opener */
.opener{padding:36px 34px;color:#fff;background-size:cover;background-position:center;min-height:220px;display:grid;align-content:end;gap:6px}
.opener .num{font-weight:800;font-size:15px;letter-spacing:.1em;text-transform:uppercase;background:#fff;color:var(--pink-deep);justify-self:start;padding:4px 12px;border-radius:999px}
.opener h2{font-size:38px;color:#fff;text-shadow:0 2px 14px rgba(40,20,30,.5);max-width:16ch}
.opener.dark h2{color:var(--ink);text-shadow:none}
.feathers{background-image:url(img/feathers.webp)}
.hills{background-image:url(img/hills.webp);background-position:center 0%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.chip{background:var(--moss);color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}
.chip.w{background:#f2eee6;color:var(--ink)}
.pull{font-weight:800;font-size:28px;line-height:1.2;color:var(--pink-deep);margin:18px 0;max-width:22ch;text-wrap:balance}
/* mock of the app */
.mock{display:grid;gap:10px;background:url(img/fur-orig.webp) center/360px;border-radius:24px;padding:18px;margin:6px 0 18px}
.mock .card{background:url(img/feathers.webp) center/cover;border-radius:18px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 4px 12px rgba(30,45,15,.2)}
.mock .card b{font-size:14px;font-weight:800}
.mock .card span{background:var(--pink);color:#fff;font-weight:800;font-size:14px;padding:9px 14px;border-radius:999px;white-space:nowrap}
.mock .wa{justify-self:end;max-width:82%;background:#dcf8c6;border-radius:18px 18px 6px 18px;padding:10px 14px;font-weight:600;font-size:16px;box-shadow:0 4px 12px rgba(30,45,15,.2)}
.mock .wa small{display:block;text-align:right;font-size:11px;opacity:.55;font-weight:600}
/* stickers */
.stickers{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 0}
.st{display:grid;gap:4px;justify-items:center;font-size:13px;font-weight:800;width:84px;text-align:center}
.st i{width:84px;height:84px;border-radius:22px;background-size:cover;background-position:center;display:block;box-shadow:0 3px 10px rgba(30,45,15,.18)}
/* end */
.end{background:var(--pink);color:#fff;padding:34px}
.end h2{color:#fff}
.end .url{display:inline-block;margin:14px 0 18px;background:#fff;color:var(--pink-deep);font-weight:800;font-size:20px;padding:12px 20px;border-radius:999px;text-decoration:none}
.how{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.how{grid-template-columns:1fr}}
.how div{background:rgba(255,255,255,.95);color:var(--ink);border-radius:20px;padding:14px 16px}
.how b{display:block;margin-bottom:4px}
.how ol{margin:0;padding-left:20px;font-size:16px;line-height:1.45}
.hug{font-weight:800;font-size:22px;margin-top:18px}
@media print{.top{display:none}@page{size:A4;margin:8mm}section{box-shadow:none}}
</style>
</head>

    <div class="stickers">

      <div class="st"><i style="background:#fff url(img/logo.png) center/80% no-repeat"></i><span data-t="st5"></span></div>
    </div>
  </section>

  <section class="page" aria-labelledby="h-priv">
    <p class="kicker" data-t="privK"></p>
    <h2 id="h-priv" data-t="privH" style="margin-bottom:14px"></h2>
    <p data-t="privP"></p>
  </section>

  <section class="end" aria-labelledby="h-try">
    <h2 id="h-try" data-t="tryH"></h2>
    <a class="url" href="https://akimyanola.github.io/fcknggn/">akimyanola.github.io/fcknggn</a>
    <div class="how">

      <div><b data-t="andH"></b><ol><li data-t="a1"></li><li data-t="a2"></li></ol></div>
    </div>

  </section>
