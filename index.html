<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7f9550">
<link rel="icon" href="icons/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="fcknggn">
<meta name="description" content="Трекер цикла и настроения. Все записи хранятся только на твоём телефоне.">
<title>fcknggn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: phone-width column on a felt-with-daisies backdrop; every panel is filled with a photo texture (feathers, lime felt, hills, hen, daisy); three views switched by a bottom bar; entries edited in a bottom sheet */
:root{
  --ink:#2c3d1a;
  --muted:#5d6a45;
  --line:rgba(255,255,255,.55);
  --lime:#c3d08a;
  --lime-soft:rgba(232,237,205,.78);
  --moss:#4e6232;
  --pink:#e9a9b7;
  --pink-deep:#cf7c8c;
  --pink-soft:rgba(248,214,222,.85);
  --sky:#cfdcea;
  --sand:#ecdcb8;
  --glass:rgba(255,255,255,.62);
  --m1:#6c7a86; --m2:#a6b3bd; --m3:#e8e6d2; --m4:#9fb35f; --m5:#e9a9b7;
  --display:"Onest", system-ui, sans-serif;
  --body:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font:15px/1.5 var(--body);background:#c2ce86;-webkit-tap-highlight-color:transparent}
.backdrop{position:fixed;inset:0;background:#c2ce86;z-index:-1;overflow:hidden;display:grid;align-content:start}
.furpanel{isolation:isolate}
.furpanel::before{content:"";position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;max-width:900px;max-height:900px;transform:translate(-50%,-50%) rotate(45deg);background:url(img/fur-orig.webp) center/180px repeat;z-index:-1}
.backdrop .tilev{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#c2ce86 url(img/hen-poster.jpg) center/cover}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pink-deep);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:18px 14px calc(92px + env(safe-area-inset-bottom))}
.view{display:grid;gap:14px}
.view[hidden]{display:none}
/* display type: all caps, modest size */
h1{font:700 15px/1.25 var(--body);margin:0;text-wrap:balance}
h2{font:700 14px/1.3 var(--body);margin:0}
h3{font:700 13px/1.3 var(--body);margin:0}
.small{font-size:13px}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
/* photo-filled panels */
.panel{border-radius:18px;padding:12px 14px;display:grid;gap:10px;font-weight:600;position:relative;overflow:hidden;background-size:cover;background-position:center;box-shadow:0 6px 18px rgba(30,45,15,.18)}
.bg-lime{background-image:url(img/lime.webp);background-size:300px}
.bg-feathers{background-image:url(img/feathers.webp)}
.bg-hills{background-image:url(img/hills.webp);background-position:center 70%}
.bg-hen{background-image:url(img/hen.webp);background-position:right 38%;background-size:62% auto;background-repeat:no-repeat;background-color:#c3cf88}
.bg-daisy{background-image:url(img/daisy.webp);background-size:190%;background-position:88% 90%}
.glass{display:grid;gap:2px}
.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--pink);color:#fff;font-weight:700;cursor:pointer;width:100%;font-size:14px;box-shadow:0 4px 12px rgba(160,70,90,.25);text-shadow:none}
.btn.green{background:var(--moss);box-shadow:none}
.pillbtn{border:0;border-radius:999px;padding:6px 13px;font-size:13px;text-shadow:none;background:#fff;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(30,45,15,.15)}
.iconbtn{border:0;background:rgba(255,255,255,.7);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;font-size:18px;line-height:1}
.lang{border:0;background:rgba(255,255,255,.8);border-radius:999px;padding:6px 10px;font-weight:700;font-size:12px;letter-spacing:.06em;cursor:pointer}

/* ---- today ---- */
.hello{display:flex;justify-content:space-between;align-items:center;gap:10px}
.titlepill{background:url(img/lime.webp) center/300px;border-radius:999px;padding:7px 14px 6px;box-shadow:0 4px 12px rgba(20,35,10,.2)}
.hello h1{font-size:14px}
.weekhead{display:flex;justify-content:space-between;align-items:center}
.weekhead .open{border:0;background:rgba(255,255,255,.75);border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center;text-transform:capitalize}
.weekhead .open svg{width:16px;height:16px}
.weekhead .iconbtn{width:30px;height:30px;font-size:16px}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wd{font-size:11px;color:var(--ink);font-weight:600;opacity:.75}
.wday{border:0;background:#fff;border-radius:50%;width:34px;height:34px;margin:4px auto 0;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.wday.per{color:var(--pink-deep)}
.wday.sel{background:var(--pink);color:#fff}
.wday.today:not(.sel){box-shadow:inset 0 0 0 2px var(--moss)}
.ringwrap{width:100%;max-width:340px;margin:0 auto;filter:drop-shadow(0 8px 18px rgba(20,35,10,.3))}
.ringwrap svg{width:100%;height:auto;display:block}
.dayinfo{text-align:center;display:grid;gap:2px;justify-items:center;color:var(--ink);font-weight:800}
.dayinfo .l1{font:700 15px/1.3 var(--body)}
.dayinfo .l2{font-size:14px;font-weight:800}
.big{font:700 15px/1.3 var(--body)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.8);justify-self:start}
.pill i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;border-radius:999px;padding:3px 9px;text-shadow:none;background:rgba(255,255,255,.78);font-weight:500}
.tiles{display:grid;gap:12px}
.avgs{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:62%}
.avgs div{display:grid}
.tile{min-height:78px;align-content:start;gap:0;cursor:default}
.tile b{font:700 14px/1.3 var(--body);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;font-weight:600;line-height:1.3}
.tile.wide{grid-column:1 / -1;min-height:78px;cursor:pointer;border:0;text-align:left;font:inherit;font-weight:600;color:inherit}
.tile.wide span{max-width:none}

/* ---- calendar ---- */
.calhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.calhead h1{font-size:14px}
#mTitle{text-transform:capitalize}
#weekPanel .wd{color:#fff}
.cal{padding:0;gap:0}
.cal .dows,.cal .grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .dows div{text-align:center;font-size:12px;font-weight:700;padding:10px 0 8px;opacity:.8}
.cell{border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:transparent;min-height:56px;padding:5px 5px 4px;text-align:left;cursor:pointer;display:grid;grid-template-rows:auto 1fr;position:relative}
.cell:nth-child(7n+1){border-left:0}
.cell.out{cursor:default}
.cell.out .n{opacity:.35}
.cell .n{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.cell .cd{position:absolute;right:5px;top:6px;font-size:10px;font-weight:600;opacity:.7;font-variant-numeric:tabular-nums}
.cell .ic{display:flex;gap:2px;align-self:end;justify-content:center}
.cell .ic img{width:20px;height:20px}
.cell.emo{background:url(img/fur.webp) center/90px}
.cell.ovu{background:url(img/egg.webp) center/cover}
.cell.per{background:url(img/hen.webp) center 35%/cover}
.cell.sex{background:url(img/rooster.webp) center/cover}
.cell.per .n,.cell.emo .n,.cell.per .cd,.cell.emo .cd,.cell.ovu .n,.cell.ovu .cd,.cell.sex .n,.cell.sex .cd{opacity:1}
.cell.pred{background:repeating-linear-gradient(135deg,rgba(255,255,255,.25) 0 6px,var(--pink-soft) 6px 9px)}
.cell.pms:not(.per){background:rgba(236,220,184,.6)}
.cell.today .n{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.cell.sel{box-shadow:inset 0 0 0 3px var(--pink-deep);z-index:1}
.cell.sel:not(.per):not(.emo){background:var(--pink);color:#fff}
.cell.sel .cd{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;font-weight:600;align-items:center}
.legend img{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.legend i{display:inline-block;width:16px;height:16px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.08)}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.norec{text-align:center;display:grid;gap:4px;justify-items:center;padding:6px 0}

/* ---- stats ---- */
.hist{display:grid;gap:14px}
.hrow{display:grid;gap:5px}
.hrow .top{display:flex;justify-content:space-between;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.bar{position:relative;height:16px;border-radius:999px;background:rgba(255,255,255,.6);overflow:hidden}
.bar .p{position:absolute;left:0;top:0;bottom:0;background:var(--pink-deep);border-radius:999px;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.bar .s{position:absolute;top:0;bottom:0;background:var(--sand)}
.bar .o{position:absolute;top:1px;width:14px;height:14px;border-radius:50%;background:url(img/i-daisy.png) center/cover}
.mbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.6)}
.mbar span{height:100%}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.fchip{border:0;background:rgba(255,255,255,.75);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap;font-weight:700;font-size:12.5px;text-shadow:none}
.fchip[aria-pressed="true"]{background:var(--pink);color:#fff}
.phase{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.phase:first-child{border-top:0;padding-top:0}
.phase .ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.erow{display:grid;grid-template-columns:9.5em 1fr 2.6em;gap:8px;align-items:center;font-size:13px;font-weight:500}
.erow .track{height:8px;border-radius:999px;background:rgba(255,255,255,.6);overflow:hidden}
.erow .fill{height:100%;border-radius:999px}
.erow .pct{text-align:right;font-variant-numeric:tabular-nums}
.empty{font-size:14px;margin:0;font-weight:500}
.mlegend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;font-weight:600}
.mlegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* ---- tab bar ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:url(img/lime.webp) center/300px;box-shadow:0 -4px 16px rgba(20,35,10,.2);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}
.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{border:0;background:transparent;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;cursor:pointer;padding:4px;opacity:.75}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--pink-deep);opacity:1;font-weight:800}

/* ---- sheet ---- */
.scrim{position:fixed;inset:0;background:rgba(30,45,15,.4);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:url(img/lime.webp) center/300px;width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));display:grid;gap:16px}
.sheethead{display:flex;align-items:center;gap:12px}
.sheethead img{width:58px;height:58px;border-radius:50%;object-fit:cover;flex:none;border:3px solid #fff}
.sheethead .t{flex:1}
.field{display:grid;gap:8px}
.lbl{font-size:14px;font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:rgba(255,255,255,.8);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--moss);color:#fff}
.chip.period[aria-pressed="true"]{background:var(--pink-deep)}
.chip.rm{background:transparent;border:1px dashed var(--moss)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:0;background:rgba(255,255,255,.8);border-radius:14px;padding:8px 2px;cursor:pointer;display:grid;gap:4px;justify-items:center;font-size:11.5px;line-height:1.2;font-weight:500}
.scale .dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
.scale button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.addrow{display:flex;gap:6px}
.addrow input{font:inherit;font-size:13px;color:var(--ink);background:rgba(255,255,255,.85);border:1px dashed var(--moss);border-radius:999px;padding:7px 12px;flex:1;min-width:0}
textarea{font:inherit;color:var(--ink);background:rgba(255,255,255,.85);border:0;border-radius:14px;padding:10px 12px;width:100%;min-height:76px;resize:vertical}
.care{font-size:13px;background:var(--pink-soft);border-radius:14px;padding:10px 12px}
.status{font-size:13px;min-height:1.2em;font-weight:600}

@media (prefers-reduced-motion:no-preference){.chip,.scale button,.cell,.wday,.fchip{transition:background .15s,color .15s}}
</style>
</head>
<body>
<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<div class="app">

  <!-- TODAY -->
  <section class="view" id="v-today" aria-labelledby="hello">
    <div class="hello">
      <h1 id="hello" class="titlepill" data-t="hello"></h1>
      <button class="lang" id="langBtn" type="button"></button>
    </div>
    <div class="panel bg-hills" id="weekPanel">
      <div class="weekhead">
        <button class="iconbtn" id="wPrev" type="button" data-tl="prevWeek">‹</button>
        <button class="open" id="openCal" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span id="wTitle"></span></button>
        <button class="iconbtn" id="wNext" type="button" data-tl="nextWeek">›</button>
      </div>
      <div class="weekdays" id="week"></div>
    </div>
    <div class="ringwrap" id="ring"></div>
    <div class="dayinfo panel" id="dayinfo" style="background:url(img/hills.webp) center 92%/cover;color:#f8cdd7;text-shadow:none"></div>
    <button class="btn" id="logBtn" type="button" data-t="howAreYou"></button>
    <div class="panel bg-feathers" id="marks"></div>
      </section>

  <!-- CALENDAR -->
  <section class="view" id="v-calendar" hidden aria-labelledby="mTitle">
    <div class="calhead">
      <button class="iconbtn" id="mPrev" type="button" data-tl="prevMonth">‹</button>
      <h1 id="mTitle" class="titlepill"></h1>
      <button class="iconbtn" id="mNext" type="button" data-tl="nextMonth">›</button>
    </div>
    <div class="panel bg-lime cal">
      <div class="dows" id="dows"></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="panel bg-lime" style="padding:10px 14px">
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel bg-feathers" id="dayCard"></div>
  </section>

  <!-- STATS -->
  <section class="view" id="v-stats" hidden aria-labelledby="sTitle">
    <div class="calhead"><h1 id="sTitle" class="titlepill" data-t="myCycles"></h1></div>
    <div class="tiles" id="statTiles"></div>
    <button class="btn" id="markPeriod" type="button" data-t="markPeriod"></button>
    <div class="panel bg-lime">
      <h2 data-t="history"></h2>
      <div class="filters" id="histFilter" role="group"></div>
      <div class="mlegend" id="mlegend"></div>
      <div class="hist" id="hist"></div>
    </div>
    <div class="panel bg-lime">
      <h2 data-t="emoByPhase"></h2>
      <div class="filters" id="phaseFilter" role="group"></div>
      <div id="emoPhases"></div>
    </div>
    <div class="panel bg-feathers">
      <h2 data-t="forDoctor"></h2>
      <p class="small" style="margin:0;font-weight:500" data-t="forDoctorText"></p>
      <div class="row"><button class="pillbtn" id="copy" type="button" data-t="copy"></button><span class="status" id="copyStatus" role="status"></span></div>
    </div>
    <div class="panel bg-lime">
      <h2 data-t="backup"></h2>
      <p class="small" style="margin:0" data-t="backupText"></p>
      <div class="row"><button class="pillbtn" id="exportBtn" type="button" data-t="exportBtn"></button><label class="pillbtn" for="importFile" data-t="importBtn" style="cursor:pointer"></label><input type="file" id="importFile" accept="application/json,.json" hidden><span class="status" id="backupStatus" role="status"></span></div>
    </div>
    <div class="panel bg-lime">
      <h2 data-t="about"></h2>
      <p class="small" style="margin:0" data-t="disclaimer"></p>
      <a class="small" href="privacy.html" data-t="privacy" style="color:var(--ink);font-weight:700"></a>
    </div>
    <p class="small" id="storeNote" style="margin:0;justify-self:start;border-radius:14px;background:url(img/lime.webp) center/300px;padding:8px 12px"></p>
  </section>
</div>

<nav class="tabbar" id="tabbar">
  <div class="in">
    <button class="tab" data-view="today" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/></svg><span data-t="tabToday"></span></button>
    <button class="tab" data-view="calendar" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span data-t="tabCal"></span></button>
    <button class="tab" data-view="stats" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg><span data-t="tabStats"></span></button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="sheethead">
      <img id="shImg" src="img/hills.webp" alt="">
      <div class="t"><h2 id="shTitle"></h2><div class="small" style="font-weight:600" id="shSub"></div></div>
      <button class="iconbtn" id="shClose" type="button" data-tl="close">×</button>
    </div>
    <div class="field"><span class="lbl" id="flowLbl" data-t="period"></span><div class="seg" role="group" aria-labelledby="flowLbl" id="flow"></div></div>
    <div class="field"><span class="lbl" id="moodLbl" data-t="mood"></span><div class="scale" role="group" aria-labelledby="moodLbl" id="mood"></div></div>
    <div class="field"><span class="lbl" id="energyLbl" data-t="energy"></span><div class="scale" role="group" aria-labelledby="energyLbl" id="energy"></div></div>
    <div class="field"><span class="lbl" id="anxLbl" data-t="anxiety"></span><div class="scale" role="group" aria-labelledby="anxLbl" id="anxiety"></div></div>
    <div class="field"><span class="lbl" id="sexLbl" data-t="sex"></span><div class="seg" role="group" aria-labelledby="sexLbl" id="sex"></div></div>
    <div class="field">
      <div class="row between"><span class="lbl" data-t="whatHappened"></span><button class="chip" id="editTags" type="button"></button></div>
      <div id="tags" style="display:grid;gap:12px"></div>
    </div>
    <div class="care" id="care" hidden data-t="care"></div>
    <div class="field"><label class="lbl" for="note" data-t="note"></label><textarea id="note"></textarea></div>
    <div class="row between">
      <span class="status" id="status" role="status"></span>
      <button class="pillbtn" id="clearDay" type="button" data-t="clearDay"></button>
    </div>
    <button class="btn green" id="shDone" type="button" data-t="done"></button>
  </div>
</div>

<script>
(function(){
"use strict";
/* ---------- i18n ---------- */

/* ---------- cycle math ---------- */
const isPeriod=k=>!!(entries[k]&&entries[k].flow>=2);
const hasFlow=k=>!!(entries[k]&&entries[k].flow>=1);
function starts(){return Object.keys(entries).filter(isPeriod).sort().filter(k=>!isPeriod(addDays(k,-1))&&!isPeriod(addDays(k,-2))&&!isPeriod(addDays(k,-3)));}
function periodLen(s){let n=1,gap=0;for(let i=1;i<15;i++){if(hasFlow(addDays(s,i))){n=i+1;gap=0;}else if(++gap>1)break;}return n;}
function info(){
  const s=starts();const lens=[];
  for(let i=1;i<s.length;i++){const d=diff(s[i],s[i-1]);if(d>=18&&d<=60)lens.push(d);}
  const recent=lens.slice(-6);
  const avg=recent.length?Math.round(recent.reduce((a,b)=>a+b,0)/recent.length):28;
  const pls=s.slice(-6).map(periodLen);
  const avgP=pls.length?Math.round(pls.reduce((a,b)=>a+b,0)/pls.length):5;
  const last=s.length?s[s.length-1]:null;
  return {s,avg,avgKnown:recent.length>0,avgP,avgPKnown:pls.length>0,last,next:last?addDays(last,avg):null};
}
function phaseOfDay(cd,L,P){if(cd<=P)return "men";const O=L-14;if(cd>=O-1&&cd<=O+1)return "ovu";if(cd<O-1)return "fol";return "lut";}
function cycleAt(k,I){
  I=I||info();let idx=-1;
  for(let i=0;i<I.s.length;i++){if(I.s[i]<=k)idx=i;else break;}
  if(idx<0)return null;
  const st=I.s[idx];const L=idx+1<I.s.length?diff(I.s[idx+1],st):I.avg;const cd=diff(k,st)+1;
  if(idx+1>=I.s.length&&cd>L&&k>todayKey&&k>=I.next){const c2=((cd-1)%L)+1;if(cd>L*4)return null;return {start:addDays(st,cd-c2),cd:c2,L,P:I.avgP,phase:phaseOfDay(c2,L,I.avgP),late:false,predicted:true};}
  if(cd>60)return null;const P=periodLen(st);
  return {start:st,cd,L,P,phase:cd>L?"lut":phaseOfDay(cd,L,P),late:cd>L&&idx+1>=I.s.length};
}

function arcPath(cx,cy,r,a0,a1){

}

  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+IR+'" fill="none" stroke="#fff" stroke-width="3"/>';
  if(c){const am=(Math.min(c.cd,L)-0.5)*per;const mx=cx+R*Math.cos(rad(am)),my=cy+R*Math.sin(rad(am));
    }

  $("ring").innerHTML=s;

function renderCalendar(){
  const I=info();const g=$("grid");g.innerHTML="";
  $("mTitle").textContent=MONTHS[lang][calMonth.getMonth()]+" "+calMonth.getFullYear();
  const pred=new Set(),pms=new Set();
  if(I.next){for(let i=0;i<I.avgP;i++)pred.add(addDays(I.next,i));for(let i=1;i<=7;i++)pms.add(addDays(I.next,-i));}
  I.s.forEach(x=>{for(let i=1;i<=7;i++)pms.add(addDays(x,-i));});
  const first=toKey(calMonth);const off=(calMonth.getDay()+6)%7;
  const daysIn=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,0).getDate();
  const total=Math.ceil((off+daysIn)/7)*7;
  for(let i=0;i<total;i++){
    const k=addDays(first,i-off);const inMonth=i>=off&&i<off+daysIn;const e=entries[k];
    const b=el("button","cell");b.type="button";
    b.appendChild(el("span","n",String(fromKey(k).getDate())));

    if(k===calDay&&inMonth)b.classList.add("sel");
    if(e&&e.sex)b.classList.add("sex");
    else if(!hasFlow(k)&&c&&c.phase==="ovu")b.classList.add("ovu");

async function commit(){
  const key=sheetDay;if(!key)return;
  if(isBlank(draft)){if(entries[key]){await persist(key,null);status(t("cleared"));}dirty=false;renderSheet();renderAll();return;}
  const e=Object.assign({},JSON.parse(JSON.stringify(draft)),{date:key,updated:new Date().toISOString()});
  entries[key]=e;dirty=false;renderSheet();renderAll();
  status(t("saving"));

}

/* ---------- background: grid of square chicken videos, each starting 1 s after the previous ---------- */
(function(){
  const box=$("backdrop");if(!box)return;
  const still=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  let timers=[],lastKey="";
  function build(){
    const W=window.innerWidth,H=window.innerHeight;
    const cols=W<520?3:(W<900?4:6);const size=W/cols;const rows=Math.ceil(H/size);
    const key=cols+"x"+rows;if(key===lastKey)return;lastKey=key;
    timers.forEach(clearTimeout);timers=[];box.innerHTML="";
    box.style.gridTemplateColumns="repeat("+cols+",1fr)";
    const n=Math.min(cols*rows,40);
    for(let i=0;i<n;i++){
      let v;
      if(still){v=el("div","tilev");}
      else{
        v=document.createElement("video");v.className="tilev";
        v.muted=true;v.loop=true;v.playsInline=true;v.setAttribute("playsinline","");v.setAttribute("muted","");
        v.preload="auto";v.poster="img/hen-poster.jpg";v.src="img/hen-walk.mp4";
        v.addEventListener("error",()=>{v.removeAttribute("src");});
        timers.push(setTimeout(()=>{const p=v.play&&v.play();if(p&&p.catch)p.catch(()=>{});},i*1000));
      }
      box.appendChild(v);
    }
  }
  build();
  let rt=null;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(build,300);});
})();

  try{
    const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});$("backupStatus").textContent=t("exported");return;}
  }catch(e){if(e&&e.name==="AbortError")return;}
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);$("backupStatus").textContent=t("exported");
});
$("importFile").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  try{
    const o=JSON.parse(await f.text());const src=o&&o.entries?o.entries:o;let n=0;
    Object.keys(src||{}).forEach(k=>{if(DATE_RE.test(k)&&src[k]&&typeof src[k]==="object"){entries[k]=src[k];n++;}});
    if(!n)throw new Error("empty");
    if(o.settings)settings=normSettings(o.settings);
    saveLocal();try{localStorage.setItem(LS+"-settings",JSON.stringify(settings));}catch(_){}
    $("backupStatus").textContent=t("importOk")+" ("+n+")";renderAll();
  }catch(err){$("backupStatus").textContent=t("importFail");}
  e.target.value="";
});

/* ---------- offline support ---------- */
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}

/* ---------- boot ---------- */
function renderAll(){renderToday();renderCalendar();renderStats();}
loadLocal();applyStatic();
show(location.hash.slice(1)||"today");
renderAll();initStore();
})();
</script>
