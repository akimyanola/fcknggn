<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fcknggn — бриф</title>
<link rel="icon" href="img/badge.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one 760px column of photo-filled panels in the app's own textures (knit fur, lime felt, feathers, hills), pink accents */
:root{
  --ink:#2c3d1a;
  --moss:#4e6232;
  --lime:#c3d08a;
  --pink:#e9a9b7;
  --pink-deep:#cf7c8c;
  --cream:#fbf3ee;
  --font:"Onest","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:17px/1.55 var(--font);color:var(--ink);background:#c2ce86 url(img/fur-orig.webp) center/700px repeat;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{max-width:760px;margin:0 auto;padding:28px 16px 48px;display:grid;gap:18px}
.panel{border-radius:28px;padding:30px 28px;position:relative;overflow:hidden;background-size:cover;background-position:center;box-shadow:0 10px 30px rgba(30,45,15,.22);break-inside:avoid}
.lime{background-image:url(img/lime.webp);background-size:cover}
.feathers{background-image:url(img/feathers.webp)}
.hills{background-image:url(img/hills.webp);background-position:center 0%}
.pinkbg{background:var(--pink)}
.cream{background:var(--cream)}
h1,h2,h3,p{margin:0}
h1{font-weight:800;font-size:52px;line-height:1;letter-spacing:-.02em}
h2{font-weight:800;font-size:26px;line-height:1.15;text-wrap:balance}
h3{font-weight:800;font-size:17px;line-height:1.25}
.kicker{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--pink-deep)}
.stack{display:grid;gap:12px}
.lead{font-size:20px;line-height:1.45;font-weight:500;max-width:34ch}
.muted{opacity:.8}
.topbar{display:flex;justify-content:flex-end}
.lang{border:0;border-radius:999px;padding:7px 14px;font:700 13px var(--font);letter-spacing:.06em;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 10px rgba(30,45,15,.2)}
.lang:focus-visible,.cta:focus-visible{outline:3px solid var(--pink-deep);outline-offset:2px}
/* hero */
.hero{display:grid;grid-template-columns:180px 1fr;gap:26px;align-items:center;background:var(--cream)}
.hero img{width:180px;height:180px;border-radius:32px;display:block;box-shadow:0 8px 20px rgba(30,45,15,.25)}
.hero .tag{font-size:24px;line-height:1.25;font-weight:800;color:var(--pink-deep);margin-top:10px;text-wrap:balance}
.cta{display:inline-block;margin-top:16px;background:var(--pink-deep);color:#fff;text-decoration:none;font-weight:800;padding:13px 22px;border-radius:999px;box-shadow:0 6px 16px rgba(160,70,90,.3)}
@media (max-width:560px){.hero{grid-template-columns:1fr}.hero img{width:140px;height:140px}h1{font-size:42px}}
/* problem */
.lines{display:grid;gap:8px;margin-top:6px}
.lines div{background:rgba(255,255,255,.82);border-radius:16px;padding:10px 14px;font-weight:600}
/* main feature */
.quote{font-weight:800;font-size:30px;line-height:1.15;color:#fff;text-shadow:0 2px 12px rgba(60,30,40,.45);max-width:18ch;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}
.chip.on{background:var(--moss);color:#fff}
.whitebox{background:rgba(255,255,255,.9);border-radius:20px;padding:16px 18px;display:grid;gap:10px}
/* cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:620px){.cards{grid-template-columns:1fr}}
.card{background:#fff;border-radius:22px;overflow:hidden;display:grid;break-inside:avoid}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.card div{padding:14px 16px 16px;display:grid;gap:4px}
.card p{font-size:15px;line-height:1.45}
/* calendar legend */
.marks{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:620px){.marks{grid-template-columns:repeat(3,1fr)}}
.mark{display:grid;gap:6px;justify-items:center;text-align:center;font-weight:700;font-size:14px}
.mark i{width:100%;aspect-ratio:1/1;border-radius:16px;background-size:cover;background-position:center;display:block;box-shadow:0 3px 10px rgba(30,45,15,.15)}
.mark i.logo{background:#fff url(img/logo.png) center/80% no-repeat}
/* voice */
.voice{display:grid;gap:10px;justify-items:start}
.bubble{background:#fff;border-radius:22px 22px 22px 6px;padding:12px 18px;font-weight:700;font-size:19px;box-shadow:0 4px 12px rgba(30,45,15,.18)}
.bubble.pink{background:var(--pink);color:#fff}
.bubble.dark{background:var(--ink);color:#f8cdd7}
/* slogans */
.slogans{display:grid;gap:10px}
.slogans p{font-weight:800;font-size:22px;line-height:1.25;color:#fff;text-wrap:balance}
/* privacy */
.ticks{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.ticks li{padding-left:30px;position:relative;font-weight:600}
.ticks li::before{content:"";position:absolute;left:0;top:3px;width:20px;height:20px;border-radius:50%;background:url(img/logo.png) center/cover}
.foot{text-align:center;display:grid;gap:8px;justify-items:center}
.foot .url{font-weight:800;font-size:20px;color:var(--ink);text-decoration:none;border-bottom:3px solid var(--pink-deep)}
.small{font-size:14px}
@media print{
  body{background:#c2ce86 url(img/fur-orig.webp) center/700px repeat}
  .topbar{display:none}
  .page{padding:12px 0}
  .panel{box-shadow:none}
  @page{size:A4;margin:10mm}
}
</style>

  </section>

  <section class="panel pinkbg stack" aria-labelledby="t-slog">

    <div class="slogans"><p data-t="s1"></p><p data-t="s2"></p><p data-t="s3"></p><p data-t="s4"></p></div>
  </section>

  <section class="panel lime stack" aria-labelledby="t-priv">
    <p class="kicker" data-t="privK"></p>

    <ul class="ticks"><li data-t="pr1"></li><li data-t="pr2"></li><li data-t="pr3"></li><li data-t="pr4"></li></ul>
  </section>

  <section class="panel cream foot" aria-labelledby="t-try">

    <a class="url" href="https://akimyanola.github.io/fcknggn/">akimyanola.github.io/fcknggn</a>

  </section>
