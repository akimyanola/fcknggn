<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fcknggn — подружке</title>
<link rel="icon" href="img/badge.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a chat thread, as if she is texting a friend: messenger header, bubbles over a knit-fur wallpaper, photo and sticker messages, a link card and install steps at the end */
:root{
  --ink:#2c3d1a;
  --moss:#4e6232;
  --pink:#e9a9b7;
  --pink-deep:#cf7c8c;
  --cream:#fffaf6;
  --font:"Onest","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:17px/1.5 var(--font);color:var(--ink);background:#c2ce86 url(img/fur-orig.webp) center/640px repeat;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.phone{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:12px 16px;background:url(img/lime.webp) center/cover;box-shadow:0 4px 14px rgba(30,45,15,.2)}
.bar img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.bar .who{flex:1;display:grid;line-height:1.2}
.bar b{font-weight:800}
.bar span{font-size:13px;opacity:.75}
.lang{border:0;border-radius:999px;padding:7px 13px;font:700 13px var(--font);letter-spacing:.06em;background:#fff;color:var(--ink);cursor:pointer}
.lang:focus-visible,a:focus-visible{outline:3px solid var(--pink-deep);outline-offset:2px}
.thread{display:flex;flex-direction:column;gap:8px;padding:18px 14px 40px}
.day{align-self:center;background:rgba(255,255,255,.85);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;margin:4px 0 8px}
.msg{max-width:84%;background:var(--cream);border-radius:22px 22px 22px 6px;padding:11px 16px;box-shadow:0 3px 10px rgba(30,45,15,.18);font-weight:500;break-inside:avoid}
.msg.pink{background:var(--pink);color:#fff;font-weight:700}
.msg.dark{background:var(--ink);color:#f8cdd7;font-weight:700}
.msg b{font-weight:800}
.pic{max-width:70%;border-radius:22px 22px 22px 6px;overflow:hidden;box-shadow:0 3px 10px rgba(30,45,15,.2);break-inside:avoid;background:#fff}
.pic img{display:block;width:100%;height:auto}
.pic.small{max-width:200px}
.pics{display:flex;gap:6px;max-width:84%}
.pics .pic{flex:1;max-width:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-width:90%}
.chip{background:var(--moss);color:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:15px;box-shadow:0 2px 6px rgba(30,45,15,.2)}
.chip.w{background:#fff;color:var(--ink)}
.stickers{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;max-width:90%}
.st{display:grid;gap:4px;justify-items:center;font-size:13px;font-weight:800}
.st i{width:76px;height:76px;border-radius:20px;background-size:cover;background-position:center;display:block;box-shadow:0 3px 10px rgba(30,45,15,.2)}
.st span{background:rgba(255,255,255,.9);border-radius:999px;padding:1px 8px}
.time{font-size:11px;opacity:.55;margin-left:8px;font-weight:600}
.link{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;max-width:88%;background:#fff;border-radius:22px 22px 22px 6px;padding:12px;text-decoration:none;color:var(--ink);box-shadow:0 3px 10px rgba(30,45,15,.2);border-left:6px solid var(--pink-deep);break-inside:avoid}
.link img{width:64px;height:64px;border-radius:14px}
.link b{font-weight:800;display:block}
.link span{font-size:14px;color:var(--pink-deep);font-weight:700;word-break:break-all}
.steps{max-width:88%;background:var(--cream);border-radius:22px 22px 22px 6px;padding:14px 16px;box-shadow:0 3px 10px rgba(30,45,15,.18);display:grid;gap:8px;break-inside:avoid}
.steps h3{margin:0;font-size:16px;font-weight:800}
.steps ol{margin:0;padding-left:22px;display:grid;gap:4px}
.steps li{font-weight:500}
.sig{align-self:flex-start;font-weight:800;font-size:20px;color:#fff;text-shadow:0 2px 8px rgba(30,45,15,.6);margin:6px 4px 0}
@media print{
  .bar{position:static}
  .lang{display:none}
  .phone{min-height:0}
  @page{size:A4;margin:8mm}
}
</style>
</head>
<body>
<div class="phone">
  <header class="bar">
    <img src="img/badge.png" alt="">
    <div class="who"><b>fcknggn</b><span data-t="status"></span></div>
    <button class="lang" id="langBtn" type="button">EN</button>
  </header>

  <main class="thread" aria-label="Сообщения">
    <div class="day" data-t="day"></div>
    <div class="msg" data-t="m1"></div>
    <div class="msg" data-t="m2"></div>
    <div class="msg" data-t="m3"></div>
    <div class="pic small"><img src="img/badge.png" alt="" data-alt="altLogo"></div>
    <div class="msg" data-t="m4"></div>
    <div class="msg pink" data-t="m5"></div>
    <div class="msg" data-t="m6"></div>
    <div class="chips"><span class="chip" data-t="c1"></span><span class="chip" data-t="c2"></span><span class="chip w" data-t="c3"></span><span class="chip" data-t="c4"></span></div>
    <div class="msg" data-t="m7"></div>
    <div class="pics"><div class="pic"><img src="img/tears.webp" alt="" data-alt="altTears"></div><div class="pic"><img src="img/hyst.webp" alt="" data-alt="altHyst"></div></div>
    <div class="msg" data-t="m8"></div>
    <div class="msg" data-t="m9"></div>
    <div class="msg" data-t="m10"></div>
    <div class="stickers">
      <div class="st"><i style="background-image:url(img/hen.webp)"></i><span data-t="s1"></span></div>
      <div class="st"><i style="background-image:url(img/egg.webp)"></i><span data-t="s2"></span></div>
      <div class="st"><i style="background-image:url(img/rooster.webp)"></i><span data-t="s3"></span></div>
      <div class="st"><i style="background:#fff url(img/logo.png) center/80% no-repeat"></i><span data-t="s4"></span></div>
    </div>
    <div class="msg" data-t="m11"></div>
    <div class="msg dark" data-t="m12"></div>
    <div class="pic"><img src="img/happy.webp" alt="" data-alt="altHappy"></div>
    <div class="msg" data-t="m13"></div>
    <div class="msg" data-t="m14"></div>
    <div class="msg pink" data-t="m15"></div>
    <a class="link" href="https://akimyanola.github.io/fcknggn/"><img src="img/badge.png" alt=""><div><b>fcknggn</b><span>akimyanola.github.io/fcknggn</span></div></a>
    <div class="msg" data-t="m16"></div>
    <div class="steps">
      <h3 data-t="iosH"></h3>
      <ol><li data-t="i1"></li><li data-t="i2"></li><li data-t="i3"></li><li data-t="i4"></li></ol>
    </div>
    <div class="steps">
      <h3 data-t="andH"></h3>
      <ol><li data-t="a1"></li><li data-t="a2"></li><li data-t="a3"></li></ol>
    </div>
    <div class="msg" data-t="m17"></div>
    <div class="sig" data-t="sig"></div>
  </main>
</div>

<script>

};
let lang=location.hash==="#en"?"en":"ru";
function render(){
  const s=T[lang];document.documentElement.lang=lang;document.title=s.title;
  document.querySelectorAll("[data-t]").forEach(n=>{n.textContent=s[n.dataset.t];});
  document.querySelectorAll("[data-alt]").forEach(n=>{n.alt=s[n.dataset.alt];});
  document.querySelector(".thread").setAttribute("aria-label",s.thread);
  const b=document.getElementById("langBtn");b.textContent=s.lang;b.setAttribute("aria-label",lang==="ru"?"Switch to English":"Переключить на русский");
}
document.getElementById("langBtn").addEventListener("click",()=>{lang=lang==="ru"?"en":"ru";try{history.replaceState(null,"",lang==="en"?"#en":"#ru");}catch(e){}render();});
window.addEventListener("hashchange",()=>{lang=location.hash==="#en"?"en":"ru";render();});

</body>
</html>
